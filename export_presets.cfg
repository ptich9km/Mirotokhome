; Export presets for Mirotokhome.
; The game reads *.json / *.cfg / *.alm through FileAccess.open("res://..."), so they are
; not Godot resources and must be listed in include_filter, otherwise the exported build
; starts with empty databases (no config, no items, no units, no maps).
; Raw AI sheets (import/) and the tooling folders are kept out of the build.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.cfg, *.alm, mods/*"
exclude_filter="import/*, docs/*, tests/*, build/*, .git/*, .agents/*, .opencode/*, export_presets.cfg"
export_path="build/windows/Mirotokhome.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/ui/icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.2.0.0"
application/product_version="0.2.0.0"
application/company_name="Mirotokhome"
application/product_name="Mirotokhome"
application/file_description="Sandbox RPG"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
