; ============================================================
; Mirotokhome - игровой конфиг
;
; Эталоны по умолчанию. Сгенерировано из DEFAULTS в
; scripts/game_config.gd - правь значения здесь, потом перезапусти игру.
;
; Свои правки держи в user://config/game.cfg - он перекрывает этот
; файл и не попадает в git. Экспорт: готовится скриптом seed_user_file().
;
; ВАЖНО: имена секций и ключей не могут содержать пробелов -
; ConfigFile молча отрезает всё после первого пробела.
; ============================================================

; ============================================================
; БОЙ
; ============================================================
[combat]
attack_cooldown = 1.0    ; ранее продублировано 1.0 в enemy/mercenary/npc
damage_multiplier = 1.0    ; ГЛОБАЛЬНЫЙ множитель урона (идея из AION)
enemy_absorption_div = 40    ; поглощение врага = max_hp / это
enemy_attack_dmg_div = 5    ; атака врага = damage / это + max_hp / enemy_attack_hp_div
enemy_attack_hp_div = 30    ; атака врага = damage / enemy_attack_dmg_div + max_hp / это
enemy_defense_div = 25    ; защита врага = max_hp / это
hit_base = 70    ; база попадания, %
hit_max = 95
hit_min = 5
hit_soften = 5    ; смягчение: шанс = base*(att+soft)/(def+soft)
protection_max = 95    ; потолок сопротивления стихии, %

; ============================================================
; МАГИЯ
; ============================================================
[magic]
auto_buff_interval = 2.0    ; сек между проверками авто-баффов
auto_heal_ratio = 0.45    ; авто-лечение при HP/макс ниже порога
chain_max_targets = 6
chain_min_targets = 4
chain_radius = 160.0
npc_heal_cooldown = 6.0    ; маги-НПЦ: пауза между лечениями, сек
npc_heal_percent = 0.12    ; маги-НПЦ: доля максимального HP за лечение
sp_offset = 15.0    ; SP = навык + разум - это
staff_mana_cost = 4

; ============================================================
; ЭКОНОМИКА
; ============================================================
[economy]
loot_gold_multiplier = 1.0
sell_price_div = 2    ; продажа в магазине = цена / это
start_gold = 20    ; СТАРТОВОЕ ЗОЛОТО. Сейчас 20, а оружие стоит 150-600.

; ============================================================
; ЛУТ
; ============================================================
[loot]
enemy_gear_chance = 35
enemy_potion_chance = 45
npc_citizen_potion_chance = 50
npc_guard_potion_chance = 25

; ============================================================
; ПРОГРЕСС
; ============================================================
[progression]
unit_exp_base = 100

; ============================================================
; НАВЫКИ -> СТАТЫ  (основной 100%, вспомогательный 60%)
; ============================================================
[skill_stats]
aux_factor = 0.6    ; доля вспомогательного навыка (0.6 = 60%)
defense_per_point = 0.2    ; защита воина за очко развития
hp_per_point = 0.5    ; жизнь за очко развития (основной + 60% вспомогательного)
mana_per_point = 0.5    ; мана мага за очко развития

; ============================================================
; СТРАЖА ГОРОДА
; ============================================================
[npc]
guard_aggro_radius = 133.0    ; радиус агро городской стражи на Серых
guard_leash = 380.0    ; дальше этого от поста страж не преследует

; ============================================================
; ДВИЖЕНИЕ
; ============================================================
[movement]
accel = 1100.0
decel = 1800.0
speed_multiplier = 1.0

; ============================================================
; АВТОСЕЙВ
; ============================================================
[autosave]
interval = 60.0

; ============================================================
; КАЛЕНДАРЬ ЖИВОЙ ИГРЫ
; ============================================================
[world]
day_seconds = 300.0    ; сек реального времени на день мира: 300 с ~ ротация заданий раз в 15 мин; 0 = выкл

; ============================================================
; МЕТАЛЛ -> СТАТЫ  (двигатель этапа баланса)
; ============================================================
[metal]
absorption_exp = 0.15
absorption_max = 6
absorption_min = 1
damage_exp = 0.22
defence_exp = 0.22
reference_metal = "bronze"
to_hit_exp = 0.1

; ============================================================
; МАСТЕРСКАЯ  (кузнец / портной / мастер)
; ============================================================
[craft]
chance_improved = 15.0
chance_master = 5.0
chance_ordinary = 80.0    ; шанс обычной вещи на навыке 0, %
essence_from_garment = 1
essence_from_garment_fine = 2
essence_from_garment_rare = 3
fabric_from_armor = 1
fabric_from_armor_fine = 2
fabric_from_armor_rare = 2
fabric_from_garment = 2
fabric_from_garment_fine = 4
fabric_from_garment_rare = 6
fabric_from_weapon = 0
fabric_from_weapon_fine = 1
fabric_from_weapon_rare = 1
floor_ordinary = 5.0    ; обычная вещь не опускается ниже этого шанса, %
improved_step = 0.9
master_enabled = 1    ; вкладка «Мастер» включена
master_step = 0.5
ordinary_step = 1.4
tier_improved_mult = 1.15    ; множитель характеристик улучшенной вещи
tier_master_mult = 1.35    ; множитель характеристик мастерской вещи
xp_per_craft = 20    ; опыт навыка крафта за создание вещи
xp_per_recycle = 4
xp_tier_bonus = 15
yield_broken = 1
yield_broken_fine = 2
yield_broken_rare = 4

; ============================================================
; ГЕНЕРАЦИЯ КАРТЫ
; ============================================================
[spawn]
city_gap = 2
city_radius = 9
gray_respawn_min_dist = 26
gray_respawn_seconds = 20.0
gray_target = 150
herb_min_distance = 4
herb_region_grid = 4

; ============================================================
; СЕРЫЕ  (база тира 1: HP и урон, без разбивки по зонам)
; ============================================================
[grey]
damage_max = 26
damage_min = 18    ; база урона Серых тира 1
hp_max = 45
hp_min = 25    ; база HP Серых тира 1; тир усиливает шагом mob_tier.hp_step

; ============================================================
; ТИРЫ МОБОВ  (прирост HP и урона за тир)
; ============================================================
[mob_tier]
damage_step = 0.25    ; прирост урона за тир: x1.0 … x2.0
hp_step = 0.35    ; прирост HP за тир: x1.0 (тир 1) … x2.4 (тир 5)

; ============================================================
; ГОРОДСКИЕ NPC  (одинаковы во всех зонах)
; ============================================================
[city]
captain_damage = 12
captain_hp = 120
citizen_count_max = 9
citizen_count_min = 6    ; жителей на город
citizen_hp = 30
guard_count_max = 8
guard_count_min = 5    ; стражей на город
guard_damage_max = 10
guard_damage_min = 6
guard_hp_max = 100
guard_hp_min = 60    ; городские NPC одинаковы во всех зонах

; ============================================================
; ТОЧКИ ИНТЕРЕСА  (выключены, пока мало арта)
; ============================================================
[poi]
count = 0    ; точек интереса на карту; 0 = выключено (мало арта)
damage = 6
hp = 60

; ============================================================
; ДИЗАЙН ЗОН  (плотность Серых и леса, не боевые статы)
; ============================================================
[zone_design]
faction.gray_count_max = 130
faction.gray_count_min = 100
faction.tree_density = 0.2
hard.gray_count_max = 180
hard.gray_count_min = 140
hard.tree_density = 0.22
mid.gray_count_max = 150
mid.gray_count_min = 120
mid.tree_density = 0.2
start.gray_count_max = 60
start.gray_count_min = 40    ; дизайн карты, а не боевой рейт: сколько Серых на карте
start.tree_density = 0.18    ; плотность деревьев

; ============================================================
; СОБЫТИЯ-СТЫЧКИ
; ============================================================
[events]
enabled = 1    ; события «спасти путника»: Серые бьют мирного НПЦ, 0 = выключить
max_active = 2
members_max = 3
members_min = 2
rescue_gold_max = 80
rescue_gold_min = 40
rescue_rep = 5    ; репутация ближайшего города за спасение
rescue_victim_dmg_scale = 0.2    ; доля урона Серых по путнику (иначе не спасти)
rescue_victim_hp = 200
spawn_chance = 35
spawn_max_dist = 900
spawn_min_dist = 400
spawn_period = 45.0
ttl_seconds_max = 240
ttl_seconds_min = 90

; ============================================================
; КВЕСТЫ ГЛАВЫ ГОРОДА
; ============================================================
[quests]
blueprint_min_difficulty = 3
enabled = 1
kill_elite_dmg_mult = 1.5
kill_elite_hp_mult = 2.5
max_active = 5
offer_slots = 3
offer_ttl_days = 3
power_base = 0.2
prep_max_dist = 22
prep_min_dist = 6
rep_base = 5
urgent_seconds = 120.0

; ============================================================
; РЕПУТАЦИЯ (пропуск к товарам таверны и магазина)
; ============================================================
[reputation]
discount_1 = 5    ; скидка магазина, % (накопительно по тирам)
discount_2 = 10
discount_3 = 15
elven_rep = 40    ; с какой репутации продаются эльфийские свитки
inn_tier_cost = 40    ; доплата за тир наёмника, золото
tier_1 = 15    ; второй тир наёмников, рецепты в магазине
tier_2 = 40    ; третий тир наёмников, эльфийские свитки
tier_3 = 80    ; четвёртый тир наёмников

; ============================================================
; ФОРПОСТЫ ФРАКЦИЙ
; ============================================================
[outpost]
capture_gold = 40    ; золото за захват форпоста (сверху лута со стражи)
guards_max = 5
guards_min = 3    ; стражников в лагере
per_map = 3    ; лагерей на карту (кроме стартовой зоны)
rep_penalty = 5    ; репутация фракции за каждого убитого стражника

; ============================================================
; ОТЛАДОЧНЫЕ ПЕРЕКЛЮЧАТЕЛИ
; ============================================================
[debug]
all_magic = 0    ; 1 = все заклинания и бесконечная мана (для беты)
fog_of_war = 1    ; туман войны на карте героя (0/1)
perf = 0    ; профилировщик кадра: таблица мс/кадр по блокам в консоль
show_coords = 0    ; подпись координат в HUD

; ============================================================
; ВЕЛИКИЙ МАГ
; ============================================================
[archmage]
decay_base = 0.0005
decay_threat = 0.0015
gold_per_stake = 100
power_max = 100.0
power_start = 60.0
sim_interval = 20.0
stake_gold = 1.0
stake_ingot = 1.0
stake_potion = 1.5
tier_1 = 35.0
tier_2 = 65.0
tier_3 = 90.0

; ============================================================
; СТРЕСС-ТЕСТ
; ============================================================
[stress]
city_citizen_count = 1800
city_guard_count = 2000
enabled = 0
gen_version = 99
gray_count = 7500
map_size = 1000
tree_count = 83700
